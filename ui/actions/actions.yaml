- action_id: start_run
  title: Start run
  description: Start the crawl on the scraper service. Repeating the same workflow step returns the same
    run; the step ends at once and does not wait for the crawl.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  workflow_visible: true
  mutates_platform: false
  parameters:
  - name: config
    type: object
    required: true
  - name: skipped_start_succeeds
    type: boolean
    required: false
  result_fields:
  - result.run_id
  - result.state
  - result.site
  - result.created
  - result.idempotency_key
  - result.run_page_hint
  - result.skipped
  - result.skipped_reason
  - result.busy_run_id
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
