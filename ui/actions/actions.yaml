# Actions of the Web Scraper extension. Workflow-visible actions pair with the
# same-ID Contract V2 operation; the others are connection-form and run-page buttons.
actions:
- action_id: validate_config
  title: Validate settings
  description: Merge the run inputs and the profile defaults; the service checks every value against
    its limits and names any field it refuses.
  required_scopes:
  - extension:invoke
  - artifact:read
  handler:
    mode: extension
  workflow_visible: true
  mutates_platform: false
  parameters:
  - name: site_url
    type: string
    required: false
  - name: extraction_instructions
    type: string
    required: false
  - name: max_records
    type: integer
    required: false
  - name: target_page_selector
    type: string
    required: false
  - name: url_include
    type: array
    required: false
  - name: url_exclude
    type: array
    required: false
  - name: discovery_mode
    type: string
    required: false
  - name: debug
    type: boolean
    required: false
  - name: crawl_include
    type: array
    required: false
  - name: stay_in_section
    type: boolean
    required: false
  - name: ai_choose_fields
    type: boolean
    required: false
  - name: fields_hint
    type: string
    required: false
  - name: fields
    type: array
    required: false
  - name: required_fields
    type: array
    required: false
  - name: urls
    type: array
    required: false
  - name: urls_file
    type: artifact_handle
    required: false
  - name: sitemap_url
    type: string
    required: false
  - name: max_sitemap_entries
    type: integer
    required: false
  - name: sitemap_source_include
    type: array
    required: false
  - name: sitemap_source_exclude
    type: array
    required: false
  - name: max_pages
    type: integer
    required: false
  - name: single_page
    type: boolean
    required: false
  - name: fetch_mode
    type: string
    required: false
  - name: browser
    type: string
    required: false
  - name: browser_os
    type: string
    required: false
  - name: canvas_noise
    type: string
    required: false
  - name: use_proxy_tiers
    type: array
    required: false
  - name: challenge_click
    type: boolean
    required: false
  - name: use_solver
    type: boolean
    required: false
  - name: politeness
    type: string
    required: false
  - name: delay_min_seconds
    type: number
    required: false
  - name: delay_max_seconds
    type: number
    required: false
  - name: max_concurrency
    type: integer
    required: false
  - name: max_requests_per_minute
    type: integer
    required: false
  - name: page_timeout_seconds
    type: integer
    required: false
  - name: extraction_mode
    type: string
    required: false
  - name: structured_data_types
    type: array
    required: false
  - name: wait_after_load_ms
    type: integer
    required: false
  - name: wait_for_selector_ms
    type: integer
    required: false
  - name: headers
    type: object
    required: false
  - name: respect_robots
    type: boolean
    required: false
  - name: rebuild_mapping
    type: boolean
    required: false
  - name: link_rules_off
    type: array
    required: false
  - name: trap_pattern_budget
    type: integer
    required: false
  - name: when_site_busy
    type: string
    required: false
  - name: site_settings
    type: object
    required: false
  result_fields:
  - result.valid
  - result.config
  - result.warnings
  - result.warning_text
  - result.sources
  - result.site
  - result.discovery_mode
  - result.is_url_list
  - result.url_count
  - result.rebuild_mapping
  - result.required_fill_threshold
  - result.max_refinements
  - result.extraction_instructions
  - result.fields
  - result.required_fields
  - result.extraction_mode
  - result.target_page_selector
  - result.ai_choose_fields
  - result.fields_hint
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
  - service_unreachable
  - service_timeout
  - service_unauthorized
  - service_unavailable
  - service_error
  - service_route_missing
  - service_rejected_request
  - invalid_service_response
  - request_too_large
  - internal_error
  - config_invalid
  - urls_file_invalid
  - url_list_too_long
- action_id: analyze_site
  title: Analyze site
  description: Look at robots.txt, the sitemap, JavaScript need and protection of the site, and recommend
    a discovery strategy. Takes up to two minutes.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  workflow_visible: true
  mutates_platform: false
  parameters:
  - name: config
    type: object
    required: true
  result_fields:
  - result.analysis
  - result.recommended_discovery_mode
  - result.discovery_mode
  - result.sitemap_found
  - result.sitemap_url_count
  - result.js_required
  - result.protection
  - result.needs_proxy
  - result.reasons
  - result.warnings
  - result.protection_summary
  - result.protection_not_passed
  - result.link_rules
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
  - service_unreachable
  - service_timeout
  - service_unauthorized
  - service_unavailable
  - service_error
  - service_route_missing
  - service_rejected_request
  - invalid_service_response
  - request_too_large
  - internal_error
  - config_invalid
