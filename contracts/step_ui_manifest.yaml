    help_text: 'Which missed pages, by their unextracted reason: fetch_failed, blocked, incomplete, no_template, template_failed, stopped, not_found, robots_disallowed, private_address_refused. Empty: fetch_failed, blocked, incomplete, no_template, template_failed and stopped.'
