  - name: target_page_selector
    widget_type: text
    label: Product page selector
    help_text: The operator's product page selector (target_page_selector). The AI is told to put it into every template's match.selector; the test warns when a template lacks it.
  - name: ai_choose_fields
    widget_type: boolean
    label: Let the AI choose the fields
    help_text: "On: the agent adds the fields the samples really carry, beyond Fields."
  - name: fields_hint
    widget_type: text
    label: Fields hint
    help_text: "The operator's hint for those fields, e.g. 'wine: vintage, type, bottle size, taste'."
- operation_id: service_storage
  title: Service storage
  section: Web Scraper · Service
  fields: []
- operation_id: clean_up_storage
  title: Clean up service storage
  section: Web Scraper · Service
  fields:
  - name: dry_run
    widget_type: boolean
    label: Dry run
    help_text: 'On: nothing is removed; the answer says what would be removed and how much space it frees. Off: remove. Empty: on.'
  - name: working_files_older_than_days
    widget_type: integer
    label: Working files older than (days)
    help_text: 'The pages finished runs loaded, for runs that ended at least this many days ago. 0: every finished run. The run and its result stay. Empty: not touched.'
  - name: result_files_older_than_days
    widget_type: integer
    label: Result files older than (days)
    help_text: 'Result files of runs that ended at least this many days ago. The run stays, its result is gone from the service. Empty: not touched.'
  - name: include_unfetched_results
    widget_type: boolean
    label: Include results Flow Steward has not fetched
    help_text: 'On: also remove result files (and run records) whose result Flow Steward has not stored yet. Off or empty: those runs are kept.'
  - name: run_records_older_than_days
    widget_type: integer
    label: Run records older than (days)
    help_text: 'Whole finished runs that ended at least this many days ago: records, events, working files and result. The run is gone from the Runs page. Empty: not touched.'
  - name: samples_older_than_hours
    widget_type: integer
    label: Samples and screenshots older than (hours)
    help_text: 'Sample pages and protection screenshots last written at least this many hours ago. 0: all. Empty: not touched.'
  - name: compact_database
    widget_type: boolean
    label: Compact the database
    help_text: 'On: empty the database''s write-ahead log and compact the file; the file is compacted only when no run is active. Off or empty: not compacted.'
