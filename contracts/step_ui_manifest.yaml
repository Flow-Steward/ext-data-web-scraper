- operation_id: recollect_run
  title: Re-collect missed pages
  section: Web Scraper · Runs
  fields:
  - name: run_id
    widget_type: text
    label: Run id
    required: true
    help_text: The finished run whose missed pages are collected again (run_...).
    placeholder: run_01...
  - name: reasons
    widget_type: json
