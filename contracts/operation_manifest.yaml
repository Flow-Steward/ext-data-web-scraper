- operation_id: clean_up_storage
  display_name: Clean up service storage
  description: Remove what the scraper service keeps for finished runs - working files, result files,
    whole run records, samples and screenshots older than the ages you give - and compact its database.
    A dry run (the default) removes nothing and says what would go.
  operation_kind: action
  category: web_scraping
  connection_type_ids:
  - scraper_profile
  inputs:
  - *id001
  - name: dry_run
    value_type: boolean
    required: false
    display_name: Dry run
    description: 'On: nothing is removed; the answer says what would be removed and how much space it frees. Off: remove. Empty: on.'
  - name: working_files_older_than_days
    value_type: integer
    required: false
    display_name: Working files older than (days)
    description: 'The pages finished runs loaded, for runs that ended at least this many days ago. 0: every finished run. The run and its result stay. Empty: not touched.'
  - name: result_files_older_than_days
    value_type: integer
    required: false
    display_name: Result files older than (days)
    description: 'Result files of runs that ended at least this many days ago. The run stays, its result is gone from the service. Empty: not touched.'
  - name: include_unfetched_results
    value_type: boolean
    required: false
    display_name: Include results Flow Steward has not fetched
    description: 'On: also remove result files (and run records) whose result Flow Steward has not stored yet. Off or empty: those runs are kept.'
  - name: run_records_older_than_days
    value_type: integer
    required: false
    display_name: Run records older than (days)
    description: 'Whole finished runs that ended at least this many days ago: records, events, working files and result. The run is gone from the Runs page. Empty: not touched.'
  - name: samples_older_than_hours
    value_type: integer
    required: false
    display_name: Samples and screenshots older than (hours)
    description: 'Sample pages and protection screenshots last written at least this many hours ago. 0: all. Empty: not touched.'
  - name: compact_database
    value_type: boolean
    required: false
    display_name: Compact the database
    description: 'On: empty the database''s write-ahead log and compact the file; the file is compacted only when no run is active. Off or empty: not compacted.'
  outputs:
  - name: message
    value_type: text
    display_name: Summary
    description: What was (or, in a dry run, would be) removed and the space freed.
  - name: dry_run
    value_type: boolean
    display_name: Dry run
    description: True when nothing was removed.
  - name: working_files
    value_type: text
    display_name: Working files
    description: Runs and bytes removed, or not part of this clean-up.
  - name: result_files
    value_type: text
    display_name: Result files
    description: Files and bytes removed, or not part of this clean-up.
  - name: run_records
    value_type: text
    display_name: Run records
    description: Whole runs and bytes removed, or not part of this clean-up.
  - name: samples
    value_type: text
    display_name: Samples
    description: Samples and bytes removed, or not part of this clean-up.
  - name: screenshots
    value_type: text
    display_name: Screenshots
    description: Screenshots and bytes removed, or not part of this clean-up.
  - name: database
    value_type: text
    display_name: Database
    description: What compacting did or would do, and why the file was not compacted when it was skipped.
  - name: kept
    value_type: text
    display_name: Kept
    description: Runs not finished, and finished runs kept because their result was not fetched.
  - name: freed
    value_type: text
    display_name: Freed
    description: The space freed (or that would be freed), in MB or GB.
  - name: bytes_freed
    value_type: integer
    display_name: Bytes freed
    description: The same in bytes.
  - name: details
    value_type: object
    display_name: Details
    description: The request sent and the service's whole answer.
  result_fields:
  - result.message
  - result.dry_run
  - result.working_files
  - result.result_files
  - result.run_records
  - result.samples
  - result.screenshots
  - result.database
  - result.kept
  - result.freed
  - result.bytes_freed
  - result.details
