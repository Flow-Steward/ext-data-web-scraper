- operation_id: recollect_run
  display_name: Re-collect missed pages
  description: Start a new run over only the pages a finished run missed (its unextracted URLs with the
    reasons chosen), with the run's settings and the site's active mappings. The new run has its own
    result.
  operation_kind: action
  category: web_scraping
  connection_type_ids:
  - scraper_profile
  inputs:
  - *id001
  - name: run_id
    value_type: text
    required: true
    display_name: Run id
    description: The finished run whose missed pages are collected again (run_...).
  - name: reasons
    value_type: array
    required: false
    display_name: Reasons
    description: 'Which missed pages, by their unextracted reason: fetch_failed, blocked, incomplete, no_template, template_failed, stopped, not_found, robots_disallowed, private_address_refused. Empty: fetch_failed, blocked, incomplete, no_template, template_failed and stopped.'
  outputs:
  - name: message
    value_type: text
    display_name: Summary
    description: The new run, how many pages by reason, and where its result will appear.
  - name: run_id
    value_type: text
    display_name: New run id
    description: The re-collect run; its run_completed event carries parent_run_id.
  - name: parent_run_id
    value_type: text
    display_name: Run re-collected
    description: The run whose missed pages it collects.
  - name: state
    value_type: text
    display_name: State
    description: ''
  - name: url_count
    value_type: integer
    display_name: Pages
    description: How many missed pages it collects again.
  - name: by_reason
    value_type: text
    display_name: By reason
    description: The pages by unextracted reason, e.g. 'fetch failed 10, blocked 2'.
  - name: reasons
    value_type: array
    display_name: Reasons taken
    description: The unextracted reasons the run covers.
  - name: created
    value_type: boolean
    display_name: New
    description: False when the same request had already started this run.
  result_fields:
  - result.message
  - result.run_id
  - result.parent_run_id
  - result.state
  - result.url_count
  - result.by_reason
  - result.reasons
  - result.created
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
  - service_unreachable
  - service_timeout
  - service_unauthorized
  - service_unavailable
  - service_error
  - service_route_missing
  - service_rejected_request
  - invalid_service_response
  - request_too_large
  - internal_error
  - run_not_found
  - run_not_finished
  - nothing_to_recollect
  - config_invalid
  - idempotency_key_reused
  - service_busy
  - service_secrets_key_missing
