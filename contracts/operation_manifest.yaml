    value_type: integer
    display_name: Records
    description: Records of the run (the result file's count, else the extraction counter).
  - name: has_records
    value_type: boolean
    display_name: Has records
    description: False when the run produced no records; then there is no result file to get.
  - name: no_records_message
    value_type: text
    display_name: No records
    description: For a completed run without records, why (stop reason in plain words); empty otherwise.
  - name: explanation
    value_type: text
    display_name: Why it stopped
    description: The service's sentence on why the run stopped (or how it is going), with what to do.
  - name: completeness
    value_type: text
    display_name: Completeness
    description: Pages collected of the target pages found (progress while running), with a warning when records fell against the previous full run.
  - name: comparison_warning
    value_type: text
