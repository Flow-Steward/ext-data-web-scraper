    value_type: text
    display_name: Stop reason
    description: finished, max_records, max_pages, max_duration, max_result_size, stopped or blocked.
  - name: site
    value_type: text
    display_name: Site
    description: ''
  - name: terminal
    value_type: boolean
    display_name: Final
    description: True for completed or failed.
