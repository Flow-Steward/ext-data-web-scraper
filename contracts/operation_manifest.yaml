- operation_id: build_mapping
  display_name: Build mapping
  description: 'AI: write a declarative extraction mapping from the samples, test it, and refine it at
    most twice with the per-field failures. Returns the mapping and passed: false when it never passed.'
  operation_kind: action
  category: web_scraping
  inputs:
  - name: site
    value_type: text
    required: true
    display_name: Site
    description: Site key of the target site (host without www.), from 'Validate settings'.
  - name: sample_ids
    value_type: array
    required: true
    display_name: Sample ids
    description: From 'Fetch samples' or the mapping request.
  - name: samples
    value_type: array
    required: true
    display_name: Samples
    description: Distilled pages from 'Fetch samples' or the mapping request.
  - name: extraction_instructions
    value_type: text
    required: false
    display_name: What to extract
    description: The user's instructions.
  - name: fields
    value_type: array
    required: false
    display_name: Fields
    description: Fields to extract.
  - name: required_fields
    value_type: array
    required: false
    display_name: Required fields
    description: Fields a record must have.
  - name: required_fill_threshold
    value_type: number
    required: false
    display_name: Fill threshold
    description: Default 0.9.
  - name: extraction_mode
    value_type: text
    required: false
    display_name: Extraction mode
    description: auto, structured_data or selectors.
  - name: max_refinements
    value_type: integer
    required: false
    display_name: Refinements
    description: Refinements after the first generation (default 2).
  - name: previous_mappings
    value_type: array
    required: false
    display_name: Previous mappings
    description: 'For a repair: the active mapping that broke.'
  - name: previous_failures
    value_type: object
    required: false
    display_name: Previous failures
    description: 'For a repair: fill rates reported by the service.'
  - name: suggested_template_id
    value_type: text
    required: false
    display_name: Suggested template id
    description: For a new template.
  - name: target_page_selector
    value_type: text
    required: false
    display_name: Product page selector
    description: The operator's product page selector (target_page_selector). The AI is told to put it into every template's match.selector; the test warns when a template lacks it.
  - name: variant_sample_ids
    value_type: array
    required: false
    display_name: Samples with variants
    description: Sample ids whose pages carry variant data (the 'variant_sample_ids' output of 'Fetch samples' or of the mapping request). A template matching one of them must have a variants block.
  - name: ai_choose_fields
    value_type: boolean
    required: false
    display_name: Let the AI choose the fields
    description: "On: the agent adds the fields the samples really carry, beyond Fields."
  - name: fields_hint
    value_type: text
    required: false
    display_name: Fields hint
    description: "The operator's hint for those fields, e.g. 'wine: vintage, type, bottle size, taste'."
  outputs:
  - name: mappings
    value_type: array
    display_name: Mappings
    description: The last candidate, one mapping per template.
  - name: passed
    value_type: boolean
    display_name: Passed
    description: False when no candidate passed after the refinements.
  - name: field_results
    value_type: array
    display_name: Field results
    description: 'Per field: fill rate, pass flag, examples.'
  - name: failures
    value_type: array
    display_name: Failures
    description: What still fails.
  - name: attempts
    value_type: integer
    display_name: Attempts
    description: Generations tried.
  - name: summary
    value_type: text
    display_name: Summary
    description: One line per field.
  result_fields:
  - result.mappings
  - result.passed
  - result.field_results
  - result.failures
  - result.attempts
  - result.summary
