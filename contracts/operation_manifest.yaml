# Contract V2 operations of the Web Scraper extension. Every operation except
# build_mapping takes the scraper_profile connection chosen on the step;
# build_mapping is a composite action (ADR 0065) whose connection is the slot
# `profile` of its implementation workflow `impl_build_mapping`.
operations:
- operation_id: validate_config
  display_name: Validate settings
  description: Merge the run inputs and the profile defaults; the service checks every value against
    its limits and names any field it refuses.
  operation_kind: source
  category: web_scraping
  connection_type_ids:
  - scraper_profile
  inputs:
  - &id001
    name: connection_ref
    value_type: connection_ref
    required: true
    display_name: Scraper profile
    description: The scraper_profile connection chosen on the step.
  - name: site_url
    value_type: text
    required: false
    display_name: Site URL
    description: Start page of the site, e.g. https://www.example.com/. In url_list mode enter the site's home page; only the listed URLs are scraped.
  - name: extraction_instructions
    value_type: text
    required: false
    display_name: What to extract
    description: 'In words: which pages and which data, e.g. ''Product pages: name, price in EUR, article number, full description with the technical table, all images.'' Goes to the mapping agent.'
  - name: max_records
    value_type: integer
    required: false
    display_name: Maximum records
    description: 'Stop after this many records. Use 10 for a first trial run. Empty: no limit.'
  - name: target_page_selector
    value_type: text
    required: false
    display_name: Product page selector (CSS)
    description: 'A CSS selector found only on the pages you want as records (product pages): a class, id or attribute, e.g. .product-detail, #product or [itemtype$=''Product'']. Other pages are still loaded for their links but never extracted (pages you list in url_list mode always are), and the AI is told to use it in the mapping. Empty: no selector; the pages are told apart by URL and structured data.'
  - name: url_include
    value_type: array
    required: false
    display_name: Only these URLs (regex)
    description: 'Only URLs matching one of these regular expressions are loaded, e.g. ["/product/"]. Empty: every URL of the site.'
  - name: url_exclude
    value_type: array
    required: false
    display_name: Never these URLs (regex)
    description: 'URLs matching one of these regular expressions are never loaded, e.g. ["/blog/", "/about", "\\?(sort|page)="]. Empty: none excluded.'
  - name: discovery_mode
    value_type: text
    required: false
    display_name: Discovery
    description: 'How pages are found. auto lets the analysis decide; sitemap when the sitemap is trusted; crawl follows links when it is outdated; url_list scrapes exactly the given URLs. Empty: auto.'
  - name: debug
    value_type: boolean
    required: false
    display_name: Debug mode
    description: 'On: the service keeps a screenshot of each protection check and a verbose job log for this run. Leave it off for normal runs. Empty: off.'
  - name: crawl_include
    value_type: array
    required: false
    display_name: 'Where to walk (regex)'
    description: 'Links are followed only on pages whose URL matches one of these regular expressions, e.g. ["/lighting/"] to stay in a category; the start page always. Product pages linked from there are still fetched. Empty: the whole site.'
  - name: stay_in_section
    value_type: boolean
    required: false
    display_name: 'Stay inside the start page''s section'
    description: 'On: walk only the start page''s URL and everything below its path (its pagination included); added to Where to walk. No effect on a site''s home page. Empty: off.'
  - name: ai_choose_fields
    value_type: boolean
    required: false
    display_name: 'Let the AI choose the fields'
    description: 'On: the AI adds the fields the sample pages really carry (beyond Fields), guided by Fields hint; a specification table becomes one field. Empty: off - only the listed fields.'
  - name: fields_hint
    value_type: text
    required: false
    display_name: 'Fields hint'
    description: 'For Let the AI choose the fields: what kind of product and which data, e.g. ''wine: vintage, type, bottle size, taste''. Empty: no hint.'
  - name: fields
    value_type: array
    required: false
    display_name: Fields
    description: 'Field names as a JSON list, e.g. ["title", "price", "currency"]. Empty: title, description, price, currency, part_number, condition.'
  - name: required_fields
    value_type: array
    required: false
    display_name: Required fields
    description: 'Fields a record must have, e.g. ["title", "price"]. Empty: title.'
  - name: urls
    value_type: array
    required: false
    display_name: URLs (url_list)
    description: 'In url_list mode: the pages to scrape, as a JSON list.'
  - name: urls_file
    value_type: artifact_handle
    required: false
    display_name: URL file (url_list)
    description: 'In url_list mode: a CSV with a ''url'' column and an optional ''key'' column (your article number, copied into each record as source_key), or one URL per line.'
  - name: sitemap_url
    value_type: text
    required: false
    display_name: Sitemap URL
    description: 'The sitemap address when it is not in robots.txt or at /sitemap.xml. Empty: found automatically.'
  - name: max_pages
    value_type: integer
    required: false
    display_name: Maximum pages
    description: 'Pages to load at most, listing pages included. Empty: the profile''s default, normally 10000.'
  - name: single_page
    value_type: boolean
    required: false
    display_name: Only the start page
    description: 'On: scrape only the Site URL, find no other pages. Empty: off.'
  - name: fetch_mode
    value_type: text
    required: false
    display_name: Fetch mode
    description: 'http loads pages without a browser (fast); browser renders them; auto chooses per page. Empty: the profile''s default, normally auto.'
  - name: browser
    value_type: text
    required: false
    display_name: Browser
    description: 'Browser for pages that need one. Empty: the profile''s default, normally Camoufox.'
  - name: browser_os
    value_type: text
    required: false
    display_name: Browser OS
    description: 'Which OS the browser claims. host (the default) is the scraper machine''s own OS (Linux in the service image), which protection checks such as Cloudflare usually accept; windows or macos on a Linux service is usually refused by them. linux is the same as host there. Camoufox only. Empty: host.'
  - name: canvas_noise
    value_type: text
    required: false
    display_name: Canvas noise
    description: 'Whether the browser covers canvas and WebGL readback with random data: auto (the default) only when Browser OS claims another OS than the machine''s own, off never, on always. With the default Browser OS (host) the canvas reads back exactly. Camoufox only. Empty: auto.'
  - name: use_proxy_tiers
    value_type: array
    required: false
    display_name: Proxy tiers
    description: 'Which proxy tiers of the profile to use, e.g. [1, 2]. Empty: every tier the profile has.'
  - name: challenge_click
    value_type: boolean
    required: false
    display_name: Allow the checkbox click
    description: 'On: the scraper may click a protection checkbox (only if the service allows it; needs a sticky proxy). Empty: the profile''s default, normally off.'
  - name: use_solver
    value_type: boolean
    required: false
    display_name: Allow the challenge solver
    description: 'On: the scraper may use the profile''s paid challenge solver (only if the service allows it). Empty: the profile''s default, normally off.'
  - name: politeness
    value_type: text
    required: false
    display_name: Politeness
    description: 'How gently the crawl treats the site: gentle (pause 5-10 s, 1 page at a time, 10 requests a minute, page timeout 120 s), normal (2-5 s, 2 at a time, 30/min, 60 s) or fast (0.5-1.5 s, 4 at a time, 120/min, 30 s). Shortest/Longest pause, Pages at once, Requests per minute and Page timeout override it when set here or in the profile''s defaults; robots.txt Crawl-delay is always respected. Empty: normal.'
  - name: delay_min_seconds
    value_type: number
    required: false
    display_name: Shortest pause (s)
    description: 'Shortest random pause between two requests to the site, in seconds; overrides Politeness. Empty: the profile''s default if it has one, else Politeness (normal: 2).'
  - name: delay_max_seconds
    value_type: number
    required: false
    display_name: Longest pause (s)
    description: 'Longest random pause between two requests to the site, in seconds; overrides Politeness. Empty: the profile''s default if it has one, else Politeness (normal: 5).'
  - name: max_concurrency
    value_type: integer
    required: false
    display_name: Pages at once
    description: 'Pages loaded at the same time; overrides Politeness. Empty: the profile''s default if it has one, else Politeness (normal: 2).'
  - name: max_requests_per_minute
    value_type: integer
    required: false
    display_name: Requests per minute
    description: 'Requests per minute at most; overrides Politeness. Empty: the profile''s default if it has one, else Politeness (normal: 30).'
  - name: page_timeout_seconds
    value_type: integer
    required: false
    display_name: Page timeout (s)
    description: 'How long one page may take to load, in seconds (10-300), for the crawl, the analysis and the samples; a slower page is retried, then counted as not loaded. Empty: from Politeness (normal: 60).'
  - name: extraction_mode
    value_type: text
    required: false
    display_name: Extraction mode
    description: 'Where values may come from: structured_data uses only JSON-LD, selectors only CSS and meta tags, auto both. Empty: auto.'
  - name: structured_data_types
    value_type: array
    required: false
    display_name: Structured data types
    description: 'schema.org types that mark a product page, e.g. ["Product"]. Empty: Product, Offer and AggregateOffer.'
  - name: wait_after_load_ms
    value_type: integer
    required: false
    display_name: Extra wait after load (ms)
    description: 'Extra wait after a browser page has loaded, in milliseconds. Empty: the profile''s default, normally 0.'
  - name: wait_for_selector_ms
    value_type: integer
    required: false
    display_name: Wait for the selector (ms)
    description: 'How long a browser page waits for the product page selector, in milliseconds. Empty: the profile''s default, normally 10000.'
  - name: headers
    value_type: object
    required: false
    display_name: Extra HTTP headers
    description: 'Extra request headers, e.g. {"Accept-Language": "de-DE"}. No credentials or cookies. Empty: none.'
  - name: respect_robots
    value_type: boolean
    required: false
    display_name: Respect robots.txt
    description: 'Off: ignore robots.txt (only if the service allows it). Empty: the profile''s default, normally on.'
  - name: rebuild_mapping
    value_type: boolean
    required: false
    display_name: Build a new mapping
    description: 'On: the AI builds a new mapping even when the stored one still passes. Empty: off.'
  - name: link_rules_off
    value_type: array
    required: false
    display_name: Links not to skip
    description: "Rules of links the crawl skips that you switch off for this run, by name: scheme, messenger_social, sensitive_path, action_params, file_extension, nofollow, facet_params, trap_budget, dynamic_params, canonical. Example: [\"facet_params\"] when a shop's products are reached only through its filters. Guide: Links the scraper skips. Empty: every rule on."
  - name: trap_pattern_budget
    value_type: integer
    required: false
    display_name: Trap budget (pages)
    description: "A URL pattern stops being followed after this many pages in a row without a product page (crawler traps such as calendars and endless filters). 0: off. Empty: 100."
  - name: when_site_busy
    value_type: text
    required: false
    display_name: When the site is busy
    description: 'What happens when a run of the same site is still going on: skip (this start is skipped and the job ends ''Skipped'', not failed; good for schedules) or queue (the run waits and starts when the other one ends). Empty: skip.'
  - name: site_settings
    value_type: object
    required: false
    display_name: Site settings (old copies)
    description: The state of the 'Site settings' step of a project copy imported before 0.1.9. The run inputs win over it; the 0.1.9 template has no such step.
  outputs:
  - name: valid
    value_type: boolean
    display_name: Valid
    description: Always true on success; refused settings fail the step with the fields named.
  - name: config
    value_type: object
    display_name: Merged configuration
    description: Every setting with its final value; pass it to the next steps.
  - name: warnings
    value_type: array
    display_name: Warnings
    description: Values the service changed (for example a switched-off solver), with the reason.
  - name: warning_text
    value_type: text
    display_name: Warnings (text)
    description: The warnings as one readable line.
  - name: sources
    value_type: object
    display_name: Sources
    description: Which layer supplied each value.
  - name: site
    value_type: text
    display_name: Site
    description: The site key used for mappings.
  - name: discovery_mode
    value_type: text
    display_name: Discovery mode
    description: The requested discovery mode.
  - name: is_url_list
    value_type: boolean
    display_name: URL list mode
    description: True in url_list mode.
  - name: url_count
    value_type: integer
    display_name: URL count
    description: Entries in the URL list.
  - name: rebuild_mapping
    value_type: boolean
    display_name: Rebuild mapping
    description: True when the run asks for a new mapping.
  - name: required_fill_threshold
    value_type: number
    display_name: Fill threshold
    description: Share of samples a required field must fill.
  - name: max_refinements
    value_type: integer
    display_name: Refinements
    description: Refinements of the mapping after the first generation.
  - name: extraction_instructions
    value_type: text
    display_name: What to extract
    description: The instructions, for the mapping agent.
  - name: fields
    value_type: array
    display_name: Fields
    description: Final field list.
  - name: required_fields
    value_type: array
    display_name: Required fields
    description: Final required fields.
  - name: extraction_mode
    value_type: text
    display_name: Extraction mode
    description: auto, structured_data or selectors.
  - name: target_page_selector
    value_type: text
    display_name: Product page selector
    description: The merged target_page_selector, for the mapping agent and the mapping test; empty when none is set.
  - name: ai_choose_fields
    value_type: boolean
    display_name: Let the AI choose the fields
    description: True when the run lets the AI add the fields the samples carry.
  - name: fields_hint
    value_type: text
    display_name: Fields hint
    description: The run's hint for the AI-chosen fields; empty when none.
  result_fields:
  - result.valid
  - result.config
  - result.warnings
  - result.warning_text
  - result.sources
  - result.site
  - result.discovery_mode
  - result.is_url_list
  - result.url_count
  - result.rebuild_mapping
  - result.required_fill_threshold
  - result.max_refinements
  - result.extraction_instructions
  - result.fields
  - result.required_fields
  - result.extraction_mode
  - result.target_page_selector
  - result.ai_choose_fields
  - result.fields_hint
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
  - service_unreachable
  - service_timeout
  - service_unauthorized
  - service_unavailable
  - service_error
  - service_route_missing
  - service_rejected_request
  - invalid_service_response
  - request_too_large
  - internal_error
  - config_invalid
  - urls_file_invalid
  - url_list_too_long
- operation_id: analyze_site
  display_name: Analyze site
  description: Look at robots.txt, the sitemap, JavaScript need and protection of the site, and recommend
    a discovery strategy. Takes up to two minutes.
  operation_kind: source
  category: web_scraping
  connection_type_ids:
  - scraper_profile
  inputs:
  - *id001
  - name: config
    value_type: object
    required: true
    display_name: Merged configuration
    description: The 'config' output of 'Validate settings' (all settings merged and checked).
  outputs:
  - name: analysis
    value_type: object
    display_name: Analysis
    description: The service's full analysis.
  - name: recommended_discovery_mode
    value_type: text
    display_name: Recommended discovery
    description: sitemap, crawl or sitemap_and_crawl.
  - name: discovery_mode
    value_type: text
    display_name: Chosen discovery
    description: The requested mode, or the recommendation when the request was auto.
  - name: sitemap_found
    value_type: boolean
    display_name: Sitemap found
    description: True when a sitemap was found.
  - name: sitemap_url_count
    value_type: integer
    display_name: Sitemap URLs
    description: URLs counted in the sitemap.
  - name: js_required
    value_type: boolean
    display_name: JavaScript needed
    description: True when pages need a browser.
  - name: protection
    value_type: text
    display_name: Protection
    description: none, challenge, hard_block or rate_limited.
  - name: needs_proxy
    value_type: boolean
    display_name: Needs a proxy
    description: True when the site blocks direct access.
  - name: reasons
    value_type: text
    display_name: Reasons
    description: Why this strategy is recommended.
  - name: warnings
    value_type: array
    display_name: Warnings
    description: Analysis warnings.
  - name: protection_summary
    value_type: text
    display_name: Protection (plain words)
    description: One paragraph per URL that met a challenge - the steps tried and their outcome, proxy
      tier, exit country, browser and screenshot id. Empty when nothing was challenged.
  - name: protection_not_passed
    value_type: boolean
    display_name: Protection not passed
    description: True when a challenge was not passed.
  - name: link_rules
    value_type: text
    display_name: Links the crawl skips
    description: The link rules the run applies (account, cart, filters, files ...), those switched off and the trap budget, in plain words.
  result_fields:
  - result.analysis
  - result.recommended_discovery_mode
  - result.discovery_mode
  - result.sitemap_found
  - result.sitemap_url_count
  - result.js_required
  - result.protection
  - result.needs_proxy
  - result.reasons
  - result.warnings
  - result.protection_summary
  - result.protection_not_passed
  - result.link_rules
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
  - service_unreachable
  - service_timeout
  - service_unauthorized
  - service_unavailable
  - service_error
  - service_route_missing
  - service_rejected_request
  - invalid_service_response
  - request_too_large
  - internal_error
  - config_invalid
- operation_id: fetch_samples
  display_name: Fetch samples
  description: Fetch a few target pages and return distilled HTML, JSON-LD and meta data for building
    and testing a mapping.
  operation_kind: source
  category: web_scraping
  connection_type_ids:
  - scraper_profile
  inputs:
  - *id001
  - name: config
    value_type: object
    required: true
    display_name: Merged configuration
    description: The 'config' output of 'Validate settings' (all settings merged and checked).
  - name: urls
    value_type: array
    required: false
    display_name: Sample URLs
    description: Fetch exactly these pages instead of discovering target pages (at most 50).
  - name: template_id
    value_type: text
    required: false
    display_name: Template
    description: Only pages matched by this template's active mapping.
  - name: analysis_protection_summary
    value_type: text
    required: false
    display_name: Protection seen by the analysis
    description: The 'protection_summary' output of 'Analyze site'. When the samples run out of time,
      the error names the protection as the likely cause and repeats it.
  - name: analysis_protection_not_passed
    value_type: boolean
    required: false
    display_name: Analysis did not pass the protection
    description: The 'protection_not_passed' output of 'Analyze site'.
  outputs:
  - name: site
    value_type: text
    display_name: Site
    description: Site key.
  - name: sample_ids
    value_type: array
    display_name: Sample ids
    description: Ids to test mappings on (valid for 24 hours).
  - name: samples
    value_type: array
    display_name: Samples
    description: Distilled HTML, JSON-LD and meta of each page, for the mapping agent.
  - name: sample_count
    value_type: integer
    display_name: Sample count
    description: Number of samples.
  - name: jsonld_types
    value_type: array
    display_name: JSON-LD types
    description: schema.org types found on the samples.
  - name: warnings
    value_type: array
    display_name: Warnings
    description: For example fewer target pages than requested.
  - name: warning_text
    value_type: text
    display_name: Warnings (text)
    description: The warnings as one line.
  - name: protection_summary
    value_type: text
    display_name: Protection (plain words)
    description: One paragraph per sample URL that met a challenge - the steps tried and their outcome,
      proxy tier, exit country, browser and screenshot id. Empty when nothing was challenged.
  - name: variant_sample_ids
    value_type: array
    display_name: Samples with variants
    description: Sample ids whose pages carry variant data (one record per variant needs a variants block).
  - name: variant_summary
    value_type: text
    display_name: Variants
    description: Which samples carry variants, from which source, with how many variants and which options; empty when none.
  result_fields:
  - result.site
  - result.sample_ids
  - result.samples
  - result.sample_count
  - result.jsonld_types
  - result.warnings
  - result.warning_text
  - result.protection_summary
  - result.variant_sample_ids
  - result.variant_summary
  error_codes:
  - invalid_host_envelope
  - invalid_payload
  - invalid_connection
  - network_blocked
  - service_unreachable
  - service_timeout
  - service_unauthorized
  - service_unavailable
  - service_error
  - service_route_missing
  - service_rejected_request
  - invalid_service_response
  - request_too_large
  - internal_error
  - config_invalid
  - no_samples
  - protection_not_passed
- operation_id: test_mapping
  display_name: Test mapping
  description: Apply candidate mappings to the samples and report, per field, how many samples it filled
    and with which values.
  operation_kind: source
  category: web_scraping
  connection_type_ids:
  - scraper_profile
  inputs:
  - *id001
  - name: site
    value_type: text
    required: true
    display_name: Site
    description: Site key of the target site (host without www.), from 'Validate settings'.
  - name: mappings
    value_type: array
    required: false
    display_name: Mappings
    description: One mapping per page template (mapping.schema.json).
  - name: mappings_json
    value_type: text
    required: false
    display_name: Mappings as JSON text
    description: The same list as JSON text, as the mapping agent returns it; used instead of mappings
      when given.
  - name: sample_ids
    value_type: array
    required: true
    display_name: Sample ids
    description: From 'Fetch samples' or a mapping request.
  - name: required_fill_threshold
    value_type: number
    required: false
    display_name: Fill threshold
    description: Share of samples each required field must fill (default 0.9).
  - name: required_fields
    value_type: array
    required: false
    display_name: Required fields
    description: Required in addition to the fields marked required in the mapping.
  - name: extraction_mode
    value_type: text
    required: false
    display_name: Extraction mode
    description: auto, structured_data or selectors.
  - name: require_all_samples_matched
    value_type: boolean
    required: false
    display_name: Every sample must match
    description: Default true.
  - name: attempt
    value_type: integer
    required: false
    display_name: Attempts so far
    description: Used by the build loop; leave empty elsewhere.
  - name: max_refinements
    value_type: integer
    required: false
    display_name: Refinements allowed
    description: Default 2.
  - name: target_page_selector
    value_type: text
    required: false
    display_name: Product page selector
    description: The operator's product page selector (target_page_selector). The AI is told to put it into every template's match.selector; the test warns when a template lacks it.
  - name: variant_sample_ids
    value_type: array
    required: false
    display_name: Samples with variants
    description: Sample ids whose pages carry variant data (the 'variant_sample_ids' output of 'Fetch samples' or of the mapping request). A template matching one of them must have a variants block.
  outputs:
  - name: passed
    value_type: boolean
    display_name: Passed
    description: True when every matched template filled its required fields.
  - name: mappings
    value_type: array
    display_name: Mappings
    description: The tested mappings.
  - name: templates
    value_type: array
    display_name: Templates
    description: 'Per template: matched samples and pass flag.'
  - name: field_results
    value_type: array
    display_name: Field results
    description: 'Per field: fill rate, pass flag, example values.'
  - name: failures
    value_type: array
    display_name: Failures
    description: What failed, phrased for a refinement.
  - name: unmatched_sample_ids
    value_type: array
    display_name: Unmatched samples
    description: Samples no template matched.
  - name: sample_results
    value_type: array
    display_name: Sample results
    description: 'Per sample: template and missing required fields.'
  - name: required_fill_threshold
    value_type: number
    display_name: Fill threshold
    description: The threshold used.
  - name: attempt
    value_type: integer
    display_name: Attempt
    description: Attempts including this one.
  - name: attempts
    value_type: integer
    display_name: Attempts
    description: Same as attempt.
  - name: max_refinements
    value_type: integer
    display_name: Refinements allowed
    description: Refinements after the first generation.
  - name: can_refine
    value_type: boolean
    display_name: Can refine
    description: True while another refinement is allowed.
  - name: sample_ids
    value_type: array
    display_name: Sample ids
    description: The samples used.
  - name: summary
    value_type: text
    display_name: Summary
    description: One line per field.
  - name: warnings
    value_type: array
